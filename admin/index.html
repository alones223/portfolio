<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin · Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Krona+One&family=Playfair+Display:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/admin/admin.css?v=canvas-span">
  <link rel="stylesheet" href="/css/canvas.css?v=hero-canvas">
</head>
<body>
  <!-- Login -->
  <div id="login" class="login" hidden>
    <form class="login-card" id="login-form">
      <h1>Portfolio admin</h1>
      <p class="muted">Enter the admin password to edit your website.</p>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button class="btn primary" type="submit">Log in</button>
      <p class="login-error" id="login-error" role="alert"></p>
    </form>
  </div>

  <!-- App -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand">
        <strong>Portfolio admin</strong>
        <a href="/" target="_blank" rel="noopener" class="muted small">Open website ↗</a>
      </div>
      <nav id="sidebar-nav"></nav>
      <button class="btn ghost small logout" id="logout" type="button">Log out</button>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h2 id="view-title"></h2>
          <a id="view-link" class="small" target="_blank" rel="noopener" hidden>View on website ↗</a>
        </div>
        <div class="topbar-actions">
          <span id="save-state" class="save-state"></span>
          <button class="btn" id="discard" type="button" hidden>Discard changes</button>
          <button class="btn primary" id="save" type="button" disabled>Save changes</button>
        </div>
      </header>
      <main id="editor" class="editor"></main>
    </div>
  </div>

  <!-- Media picker -->
  <dialog id="picker" class="picker">
    <div class="picker-head">
      <h3>Choose an image</h3>
      <div class="picker-actions">
        <label class="btn primary small">Upload new…<input type="file" accept="image/*,video/mp4,video/webm" multiple hidden id="picker-upload"></label>
        <button class="btn small" type="button" id="picker-close">Cancel</button>
      </div>
    </div>
    <div class="picker-tools">
      <input type="search" id="picker-search" placeholder="Filter by file name…">
      <select id="picker-folder" aria-label="Folder"></select>
    </div>
    <div class="picker-grid" id="picker-grid"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/admin/canvas-model.js"></script>
  <script src="/admin/canvas-editor.js?v=text-stroke"></script>
  <script src="/admin/admin.js?v=hero-canvas"></script>
</body>
</html>
